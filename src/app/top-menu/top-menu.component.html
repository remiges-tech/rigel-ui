<nav class="navbar top-menu sticky-top">
  <div class="container-fluid d-flex align-items-center justify-content-between pointer">
    <div class="d-flex align-items-center">
      <div class="hamburger-icon" (click)="onHamburgerClick()" style="height: 40px; width: 40px; margin-top: 20px;">
      </div>
      <div class="mb-0 mt-1 p-2 remiges-logo" i18n-alt="@@remigesLogo" routerLink="/">
      </div>
    </div>

    <div class="d-none d-flex d-lg-flex d-xl-flex d-md-flex" [ngClass]="{ disabled: _commonService.getEditMode().isValueChange }">
      <!-- Language change dropdown -->
      <div class="gradient-box mt-2">
        <select class="form-select language-select" [(ngModel)]="selectedLocale"
          (change)="navigateToLocale(selectedLocale)">
          <option *ngFor="let locale of locales" [value]="locale.localeCode">
            {{ locale.label }}
          </option>
        </select>
      </div>
      <!-- Theme change -->
      <div class="mx-3 mt-1">
        <button class="btn" id="themeBtn" (click)="changeTheme()">
          <i [ngClass]="isDarkTheme ? 'fa-regular fa-sun' : 'fa-solid fa-moon'"></i>
        </button>
      </div>
    </div>
    <button class="btn d-xl-none d-md-none d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvas"
    aria-controls="offcanvas">
    <i class="fa-solid fa-bars" style="color: #ffffff;"></i>
  </button>
  </div>
</nav>
<!--offcanvas menu-->
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvas" aria-labelledby="offcanvasLabel">
  <div class="offcanvas-header">
    <div class="offcanvas-title" id="offcanvasLabel">
      <img alt="Remiges Business Icon" i18n-alt="@@remigesLogo" src="assets/img/logo.svg" />
    </div>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <!-- Placed theme and language dropdowns here -->
    <div class="mx-3">
      <button class="btn" id="themeBtn" (click)="changeTheme()" data-bs-dismiss="offcanvas">
        <i [ngClass]="isDarkTheme ? 'fa-regular fa-sun' : 'fa-solid fa-moon'"></i>
      </button>
    </div>
    <div class="gradient-box">
      <select class="form-select language-select" [(ngModel)]="selectedLocale"
        (change)="navigateToLocale(selectedLocale)" style="width: 120px;">
        <option *ngFor="let locale of locales" [value]="locale.localeCode">{{ locale.label }}</option>
      </select>
    </div>
  </div>
</div>
